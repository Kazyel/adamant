[package]
name = "adamant"
version = "0.1.0"
description = "Adamant M0 technical validation"
edition = "2024"
rust-version = "1.97"

[lib]
name = "adamant_lib"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
open = "=5.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
