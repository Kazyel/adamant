name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check frontend formatting
        run: bun run oxfmt --check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:ts
      - run: bun run knip
      - run: bun run audit:js
      - run: bun run build

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native -> target
      - name: Check Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings
      - name: Existing native tests
        run: cargo test --manifest-path native/Cargo.toml --locked --lib -- --test-threads=1
      - name: Install dependency auditor
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit Rust dependencies
        run: cargo audit --file native/Cargo.lock
