[package]
name = "adamant"
version = "0.1.0"
description = "Adamant local-first workspace"
edition = "2024"
rust-version = "1.97"

[lib]
name = "adamant_lib"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
jsonschema = { version = "=0.54.0", default-features = false }
notify = "=8.2.0"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
open = "=5.4.3"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
rfd = { version = "=0.17.2", default-features = false, features = ["gtk3"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-saphyr = { version = "=1.2.0", default-features = false, features = ["deserialize"] }
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = [
  "sqlite-bundled",
  "runtime-tokio",
] }
tauri = { version = "=2.11.5", features = [] }
uuid = { version = "=1.26.0", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[dev-dependencies]
tempfile = "=3.27.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_arguments = "warn"
